name: Flatpak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Paquet Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # bubblewrap a besoin des espaces de noms utilisateur, qu'Ubuntu
          # 24.04 restreint par défaut (AppArmor).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache de flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('build-aux/io.github.DocteurScience.Tsubame.json', 'build-aux/cargo-sources.json') }}
          restore-keys: flatpak-builder-
      - name: Construction
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --force-clean --default-branch=master \
            build-dir build-aux/io.github.DocteurScience.Tsubame.json
          flatpak build-bundle repo tsubame.flatpak io.github.DocteurScience.Tsubame master
      - uses: actions/upload-artifact@v4
        with:
          name: tsubame-flatpak
          path: tsubame.flatpak
