name: Flatpak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Paquet Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils Flatpak
        run: |
          sudo apt-get update
          # elfutils : eu-strip, pour séparer les symboles de débogage.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # bubblewrap a besoin des espaces de noms utilisateur, qu'Ubuntu
          # 24.04 restreint par défaut (AppArmor).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache de flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('build-aux/io.github.DocteurScience.Tsubame.json', 'build-aux/cargo-sources.json') }}
          restore-keys: flatpak-builder-
      - name: Construction
        run: |
          # Bus de session : la composition AppStream lit l'icône SVG avec
          # glycin, dont le chargeur isolé en a besoin.
          dbus-run-session -- flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --force-clean --default-branch=master --keep-build-dirs \
            build-dir build-aux/io.github.DocteurScience.Tsubame.json
          flatpak build-bundle repo tsubame.flatpak io.github.DocteurScience.Tsubame master
      - name: Diagnostic AppStream (en cas d'échec)
        if: failure()
        run: |
          dbus-run-session -- flatpak run --user --filesystem=host --command=appstreamcli org.gnome.Sdk//51 \
            compose --verbose --prefix=/ --origin=diagnostic \
            --result-root=/tmp/compose --hints-dir=/tmp/hints \
            --components=io.github.DocteurScience.Tsubame "$PWD/build-dir/files" || true
          find /tmp/hints -type f -exec cat {} + || true
      - uses: actions/upload-artifact@v4
        with:
          name: tsubame-flatpak
          path: tsubame.flatpak
