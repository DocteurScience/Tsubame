name: Snap

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  snap:
    name: Paquet Snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: tsubame-snap
          path: ${{ steps.build.outputs.snap }}
