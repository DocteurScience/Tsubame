name: Vérifications

on:
  push:
  pull_request:

jobs:
  rust:
    name: Format, clippy, tests, Meson, accessibilité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin meson ninja-build \
            gettext desktop-file-utils appstream \
            xvfb xauth xdotool dbus-x11 at-spi2-core python3-pyatspi \
            fonts-inter \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Meson
        run: |
          meson setup _build -Da11y-tests=true
          ninja -C _build
          meson test -C _build --print-errorlogs
      - name: Accessibilité
        run: meson test -C _build --suite a11y --print-errorlogs
